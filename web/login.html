<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HFSP 智能调度系统 - 登录</title>
  <style>
    :root {
      --bg-top: #f6f4ef;
      --bg-bottom: #ecf1f7;
      --surface: rgba(255, 255, 255, 0.74);
      --surface-strong: rgba(255, 255, 255, 0.9);
      --border: rgba(124, 141, 170, 0.16);
      --border-strong: rgba(112, 130, 160, 0.22);
      --text: #152239;
      --text-soft: #60708a;
      --text-faint: #8a98ae;
      --accent: #1677ff;
      --accent-2: #2ec6ff;
      --accent-soft: rgba(22, 119, 255, 0.08);
      --success: #15986f;
      --danger: #d35f53;
      --shadow-xl: 0 28px 84px rgba(78, 96, 126, 0.14);
      --shadow-lg: 0 18px 38px rgba(78, 96, 126, 0.11);
      --shadow-md: 0 10px 22px rgba(78, 96, 126, 0.08);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --ease-fluid: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-soft: cubic-bezier(0.2, 0.72, 0.2, 1);
      --font-stack: "SF Pro Display", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: var(--font-stack);
      color: var(--text);
      background:
        radial-gradient(circle at 14% 10%, rgba(22, 119, 255, 0.12), transparent 24%),
        radial-gradient(circle at 88% 12%, rgba(46, 198, 255, 0.11), transparent 20%),
        radial-gradient(circle at 86% 88%, rgba(255, 181, 120, 0.1), transparent 18%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient light blobs */
    .ambient {
      position: fixed;
      border-radius: 999px;
      filter: blur(56px);
      pointer-events: none;
      opacity: 0.72;
      z-index: 0;
    }
    .ambient-a {
      width: 220px; height: 220px;
      top: -40px; right: -44px;
      background: rgba(22, 119, 255, 0.14);
    }
    .ambient-b {
      width: 240px; height: 240px;
      top: 42%; left: -70px;
      background: rgba(46, 198, 255, 0.08);
    }
    .ambient-c {
      width: 220px; height: 220px;
      right: 7%; bottom: -48px;
      background: rgba(255, 181, 120, 0.1);
    }

    /* Login card */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 48px 36px 36px;
      text-align: center;
    }

    .login-brand {
      margin-bottom: 8px;
    }
    .login-brand h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .login-brand .subtitle {
      font-size: 14px;
      color: var(--text-soft);
      margin-top: 4px;
    }

    .login-form {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-soft);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      color: var(--text);
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .form-group input::placeholder {
      color: var(--text-faint);
    }

    .login-btn {
      margin-top: 8px;
      width: 100%;
      padding: 13px 24px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.15s var(--ease-soft), box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 14px rgba(22, 119, 255, 0.3);
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(22, 119, 255, 0.35);
    }
    .login-btn:active {
      transform: translateY(0);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      margin-top: 4px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      background: rgba(211, 95, 83, 0.08);
      border: 1px solid rgba(211, 95, 83, 0.18);
      border-radius: var(--radius-sm);
      display: none;
      text-align: left;
    }
    .login-error.visible {
      display: block;
      animation: shakeIn 0.35s var(--ease-soft);
    }

    @keyframes shakeIn {
      0% { transform: translateX(-6px); opacity: 0; }
      40% { transform: translateX(4px); }
      70% { transform: translateX(-2px); }
      100% { transform: translateX(0); opacity: 1; }
    }

    .login-hint {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-faint);
    }
    .login-hint code {
      font-family: "SF Mono", "Fira Code", "Menlo", monospace;
      font-size: 12px;
      background: rgba(22, 119, 255, 0.06);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* Window dots decoration */
    .window-dots {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .window-dots .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
    }
    .window-dots .dot.red { background: #ff5f57; }
    .window-dots .dot.amber { background: #febc2e; }
    .window-dots .dot.green { background: #28c840; }
  </style>
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <div class="login-card">
    <div class="window-dots" aria-hidden="true">
      <span class="dot red"></span>
      <span class="dot amber"></span>
      <span class="dot green"></span>
    </div>

    <div class="login-brand">
      <h1>HFSP 智能调度系统</h1>
      <p class="subtitle">智愈工场 · 管理端</p>
    </div>

    <form class="login-form" id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
    </form>

    <p class="login-hint">默认账号 <code>admin</code> / <code>admin123</code></p>
  </div>

  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var usernameInput = document.getElementById('username');
      var passwordInput = document.getElementById('password');
      var loginBtn = document.getElementById('loginBtn');
      var errorEl = document.getElementById('loginError');

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
      }
      function hideError() {
        errorEl.classList.remove('visible');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideError();

        var username = usernameInput.value.trim();
        var password = passwordInput.value;

        if (!username || !password) {
          showError('请输入用户名和密码');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (d) { throw new Error(d.detail || '登录失败'); });
          return res.json();
        })
        .then(function (data) {
          localStorage.setItem('token', data.access_token || data.token || '');
          localStorage.setItem('username', username);
          window.location.href = '/';
        })
        .catch(function (err) {
          showError(err.message || '网络错误，请重试');
        })
        .finally(function () {
          loginBtn.disabled = false;
          loginBtn.textContent = '登 录';
        });
      });
    })();
  </script>
</body>
</html>
